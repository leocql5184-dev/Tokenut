<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>Tokenut · 用量记录</title><link rel="stylesheet" href="client.css"></head><body>
<header><div class="brand">Tokenut<span>每日用量</span></div><button id="refresh">同步记录</button></header>
<main><section class="connect"><div><h2 id="connectTitle">连接你的 Codex</h2><p id="connectMessage">首次使用：在本机 Codex 登录并完成一次对话，程序会自动查找记录。</p><p id="connectPath"></p></div><div class="connect-actions"><button id="autoSource">自动检测</button><button id="chooseSource">选择记录文件夹</button></div></section><section class="intro"><div><h1>每一天，都有迹可循。</h1><p>本机 Codex 用量 · 北京时间每日 00:00 归档</p></div><div class="today"><span>今天 · 持续更新</span><strong id="today">—</strong><small>tokens</small></div></section>
<section class="chart-panel"><div class="chart-head"><div><h2>每日 Token 走势</h2><p id="rangeLabel"></p></div><div class="summary"><span>区间用量</span><strong id="total">—</strong></div></div>
<div id="plot"><svg id="chart" viewBox="0 0 900 300" role="img" aria-label="每日 Token 用量折线图"></svg><div id="tooltip" hidden></div><div id="empty" hidden>还没有可显示的记录。使用 Codex 后，这里会自动更新。</div></div>
<nav aria-label="时间范围"><button data-months="0" aria-pressed="true">近7天</button><button data-months="1" aria-pressed="false">近1月</button><button data-months="3" aria-pressed="false">近3月</button><button data-months="6" aria-pressed="false">近6月</button></nav>
<div class="caption"><span>每日一个点 · 空缺日期不按零计算</span><span id="connection">正在读取记录…</span></div></section>
<section class="records"><div><h2>每日记录</h2><span id="count"></span></div><table><thead><tr><th>日期</th><th>Token 用量</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="client.js"></script></body></html>
