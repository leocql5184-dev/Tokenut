<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>Tokenut</title><link rel="stylesheet" href="style.css"></head>
<body><main id="companion" aria-label="Tokenut 每日充能桌面组件">
  <canvas id="aura" width="280" height="264" aria-hidden="true"></canvas>
  <div id="character" title="拖动角色移动 · 右键打开菜单"><img id="pet-before" alt="" aria-hidden="true" draggable="false"><img id="pet" src="../assets/character/stages-v1/01-000m-initial.png" alt="原初之息角色" draggable="false"></div>
  <canvas id="particles" width="280" height="264" aria-hidden="true"></canvas>
  <section id="instrument" aria-label="今日用量">
    <div class="topline"><span id="stage">原初之息</span><span id="mode">今日充能</span><button id="menu" aria-label="打开组件设置" title="组件设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div>
    <div class="readout"><strong id="amount">—</strong><span>/ 1亿 <small>tokens</small></span></div>
    <div id="progress" role="progressbar" aria-label="每日 Token 充能进度" aria-valuemin="0" aria-valuemax="100000000"><div id="fill"></div><div id="ticks"></div><div id="thumb"></div></div>
    <div class="footline"><span id="status" aria-live="polite">正在连接 Codex</span><button id="sync" title="立即同步 Codex 用量" aria-label="立即同步"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 7M19 3v5h-5"/></svg></button></div>
  </section>
</main><script src="effects.js"></script><script src="renderer.js"></script></body></html>
